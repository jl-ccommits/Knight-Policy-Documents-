<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickQuote Sketch</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #1c1c1c; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #stage { width: 1920px; height: 1080px; flex: none; transform-origin: center; background: #ECEAE6; }
  svg { display: block; }
  .hand { font-family: Gaegu, 'Patrick Hand', cursive; font-weight: 700; }
  .pen { font-family: 'Patrick Hand', cursive; }
  #replay { position: fixed; right: 16px; bottom: 16px; font: 600 15px sans-serif; background: #fff; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; display: none; }
  body.live #replay { display: block; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="1" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#2a1d17" stroke-width="2.2" opacity=".09"/>
      <line x1="5" y1="0" x2="5" y2="9" stroke="#fff" stroke-width="1.4" opacity=".16"/>
    </pattern>
    <pattern id="scallop" width="22" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 12 Q5.5 3 11 12 Q16.5 3 22 12" fill="none" stroke="#E8735F" stroke-width="2.2"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#ECEAE6"/>
  <image id="paperTex" x="0" y="0" width="1920" height="1080" opacity=".55"/>
  <g id="world" filter="url(#boil)"></g>
  <g id="endLayer"></g>
</svg>
</div>
<button id="replay">↻ Replay</button>
<script>
const NS = 'http://www.w3.org/2000/svg';
const W = 1920, H = 1080, DURATION = 21, GROUND = 880;
const INK = '#2B211D', CORAL = '#E8735F', CORAL_DK = '#C9564A', GREEN = '#5E8C61', MUSTARD = '#E9B949', SKY = '#7FA9DA', PAPER = '#FFFDF8';
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const P = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inCubic = (x) => x * x * x;
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = (x, s = 1.9) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const bump = (t, c, d = 0.35, amp = 1) => (t >= c && t <= c + d ? Math.sin(Math.PI * (t - c) / d) * amp : 0);
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
const f1 = (v) => v.toFixed(1);

// ---------- tiny SVG + "sketchy" drawing kit ----------
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
let seedCounter = 100;
function rrPath(x, y, w, h, r, j, rnd) {
  const J = () => (rnd() - 0.5) * 2 * j;
  const p = [[x + r + J(), y + J()], [x + w - r + J(), y + J()], [x + w + J(), y + r + J()], [x + w + J(), y + h - r + J()],
    [x + w - r + J(), y + h + J()], [x + r + J(), y + h + J()], [x + J(), y + h - r + J()], [x + J(), y + r + J()]];
  const c = [[x + w, y], [x + w, y + h], [x, y + h], [x, y]];
  let d = `M${f1(p[0][0])},${f1(p[0][1])}`;
  for (let e = 0; e < 4; e++) {
    const a = p[e * 2], b = p[e * 2 + 1], n = p[(e * 2 + 2) % 8];
    d += ` Q${f1((a[0] + b[0]) / 2 + J())},${f1((a[1] + b[1]) / 2 + J())} ${f1(b[0])},${f1(b[1])}`;
    d += ` Q${c[e][0]},${c[e][1]} ${f1(n[0])},${f1(n[1])}`;
  }
  return d + 'Z';
}
function ellPath(cx, cy, rx, ry, j, rnd, n = 40) {
  let d = '';
  const ph = rnd() * 6.28, amp = j / Math.max(rx, ry);
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2, k = 1 + Math.sin(a * 3 + ph) * amp + (rnd() - 0.5) * amp * 0.4;
    d += (i ? 'L' : 'M') + f1(cx + Math.cos(a) * rx * k) + ',' + f1(cy + Math.sin(a) * ry * k);
  }
  return d + 'Z';
}
function polyPath(pts, j, rnd, close = false) {
  return 'M' + pts.map(([x, y]) => `${f1(x + (rnd() - 0.5) * j)},${f1(y + (rnd() - 0.5) * j)}`).join(' L') + (close ? 'Z' : '');
}
// fill (slightly offset, colored-pencil hatch) + main line + faint second pencil pass
function sketch(parent, d1, d2, fill, { sw = 4.5, stroke = INK, hatch = true, fillOpacity = 1 } = {}) {
  const g = el('g', {}, parent);
  if (fill) {
    el('path', { d: d1, fill, 'fill-opacity': fillOpacity, transform: 'translate(2.5 2)' }, g);
    if (hatch) el('path', { d: d1, fill: 'url(#hatch)', transform: 'translate(2.5 2)' }, g);
  }
  if (stroke) {
    el('path', { d: d1, fill: 'none', stroke, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    if (d2) el('path', { d: d2, fill: 'none', stroke, 'stroke-width': sw * 0.45, opacity: 0.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  }
  return g;
}
const rrect = (parent, x, y, w, h, r, fill, o = {}) => { const rnd = rng(o.seed ?? seedCounter++); const j = o.j ?? 2; return sketch(parent, rrPath(x, y, w, h, r, j, rnd), o.single ? null : rrPath(x, y, w, h, r, j * 1.6, rnd), fill, o); };
const ell = (parent, cx, cy, rx, ry, fill, o = {}) => { const rnd = rng(o.seed ?? seedCounter++); const j = o.j ?? 2; return sketch(parent, ellPath(cx, cy, rx, ry, j, rnd), o.single ? null : ellPath(cx, cy, rx, ry, j * 1.5, rnd), fill, o); };
const poly = (parent, pts, fill, o = {}) => { const rnd = rng(o.seed ?? seedCounter++); const j = o.j ?? 2; return sketch(parent, polyPath(pts, j, rnd, !!fill || o.close), o.single ? null : polyPath(pts, j * 1.6, rnd, !!fill || o.close), fill, o); };
const line = (parent, pts, o = {}) => poly(parent, pts, null, { single: true, ...o });
const text = (parent, x, y, str, o = {}) => { const t = el('text', { x, y, 'text-anchor': o.anchor || 'middle', class: o.cls || 'hand', 'font-size': o.size || 40, fill: o.fill || INK, ...(o.attrs || {}) }, parent); t.textContent = str; return t; };
const setT = (node, s) => node.setAttribute('transform', s);
const setO = (node, o) => { node.setAttribute('opacity', clamp(o).toFixed(3)); node.style.display = o <= 0.001 ? 'none' : ''; };

// ---------- character: ?char=folder (default) or ?char=critter (CARMA's own blocky mascot) ----------
const params = new URLSearchParams(location.search);
const CHAR = params.get('char') === 'critter' ? 'critter' : 'folder';
const HELD_Y = CHAR === 'critter' ? -330 : -282;   // where the indication card is held overhead
const HOLD_ARM = CHAR === 'critter' ? 3.6 : 2.5;

// ---------- timeline ----------
const T = {
  walkIn: [0.2, 2.3], excite: 2.5, bubble1: [2.6, 3.9],
  papers0: 3.9, bubble2: [4.9, 6.0], phoneIn: [5.9, 6.5], burst: 6.6,
  walk2: [7.2, 7.9], taps: [8.2, 9.1, 10.0, 10.9], button: 11.9,
  eject: 12.25, catch: 13.05, celebrate: [13.2, 13.8, 14.4], phoneOut: [15.4, 16.0], walk3: [15.6, 17.0],
  end: 16.8,
};
const CR_X = { home: 960, phone: 1200, end: 520 };
const PHONE = { x: 1480, y: 560 };
const ROW_Y = [-130, -50, 30, 110];
const BTN_Y = 200;
const JUMP_FOR = (ly) => (GROUND - 120) - (PHONE.y + ly); // lift so the critter's arm reaches that row

// ================= build the world =================
const worldRoot = document.getElementById('world');
const buntingLayer = el('g', {}, worldRoot);
const world = el('g', {}, worldRoot);   // everything under the camera
const endLayer = document.getElementById('endLayer');

// paper texture (static, generated once)
{
  const c = document.createElement('canvas'); c.width = 960; c.height = 540;
  const x = c.getContext('2d'), img = x.createImageData(960, 540), r = rng(77);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = r(); const g = v > 0.985 ? 150 : v > 0.93 ? 205 : 245 + r() * 10;
    img.data[i] = img.data[i + 1] = g; img.data[i + 2] = g - 4; img.data[i + 3] = v > 0.93 ? 60 : 18;
  }
  x.putImageData(img, 0, 0);
  x.globalAlpha = 0.05; x.strokeStyle = '#8a7f72';
  for (let i = 0; i < 260; i++) { const px = r() * 960, py = r() * 540, a = r() * 6.28, l = 6 + r() * 20; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }
  document.getElementById('paperTex').setAttribute('href', c.toDataURL());
}

// background doodles
const bg = el('g', {}, world);
// agency building (left)
const agency = el('g', { transform: 'translate(150 0)' }, bg);
poly(agency, [[88, 618], [262, 512], [436, 618]], '#F2C9BE', { j: 2 });
rrect(agency, 112, 612, 300, 268, 6, '#F7EADF', { j: 2 });
rrect(agency, 168, 642, 188, 50, 8, PAPER, { sw: 3.5 });
text(agency, 262, 678, 'AGENCY', { cls: 'pen', size: 32 });
rrect(agency, 232, 760, 62, 120, 6, '#E7C6A8', { sw: 3.5 });
[[140, 720], [322, 720]].forEach(([x, y]) => { rrect(agency, x, y, 62, 52, 4, '#DCE8F2', { sw: 3.5 }); line(agency, [[x + 31, y + 3], [x + 31, y + 50]], { sw: 2.5 }); line(agency, [[x + 3, y + 26], [x + 59, y + 26]], { sw: 2.5 }); });
// greenhouse (right)
const greenhouse = el('g', {}, bg);
sketch(greenhouse, 'M1540 880 L1540 705 Q1542 598 1700 596 Q1858 598 1860 705 L1860 880', 'M1542 880 L1543 708 Q1546 602 1700 600 Q1855 602 1858 708 L1858 880', '#DDEBD8', {});
[1600, 1660, 1740, 1800].forEach((x) => { const top = 705 - Math.sqrt(Math.max(0, 1 - Math.pow((x - 1700) / 160, 2))) * 100; line(greenhouse, [[x, 878], [x, top + 6]], { sw: 2.5 }); });
line(greenhouse, [[1542, 760], [1858, 760]], { sw: 2.5 });
ell(greenhouse, 1700, 668, 38, 38, PAPER, { sw: 3.5 });
{ // leaf sign
  const lg = el('g', { transform: 'translate(1700 684)' }, greenhouse);
  [-60, -30, 0, 30, 60].forEach((a, i) => { const len = [22, 30, 36, 30, 22][i]; const g2 = el('g', { transform: `rotate(${a})` }, lg); ell(g2, 0, -len / 2 - 2, 5, len / 2, GREEN, { sw: 2.2, single: true, j: 0.6 }); });
  line(lg, [[0, 0], [0, 12]], { sw: 2.5 });
}
// little plants
[[1500, 880], [1880, 880], [470, 880]].forEach(([x, y], k) => { [-30, 0, 30].forEach((a) => { const g2 = el('g', { transform: `translate(${x} ${y}) rotate(${a})` }, bg); ell(g2, 0, -18, 7, 18, GREEN, { sw: 2.5, single: true, j: 0.8 }); }); });
// ground + grass
{
  const r = rng(5), pts = [];
  for (let x = -20; x <= 1940; x += 40) pts.push([x, GROUND + (r() - 0.5) * 3]);
  line(bg, pts, { sw: 4, j: 1.5 });
  line(bg, pts.map(([x, y]) => [x + 7, y + 4]), { sw: 1.6, j: 2, attrs: {} });
  for (let x = 0; x < 1920; x += 14 + r() * 22) {
    const h = 6 + r() * 12, a = (r() - 0.5) * 0.7;
    line(bg, [[x, GROUND + 2], [x + Math.sin(a) * h, GROUND - h]], { sw: 2, j: 0.4 });
    if (r() > 0.6) line(bg, [[x + 4, GROUND + 2], [x + 4 + Math.sin(-a) * h * 0.7, GROUND - h * 0.7]], { sw: 1.8, j: 0.4 });
  }
}
// bunting
const bunting = el('g', {}, buntingLayer);
const FLAGS = [];
{
  const B = (u) => [lerp(lerp(-40, 960, u), lerp(960, 1960, u), u), lerp(lerp(92, 178, u), lerp(178, 92, u), u)];
  const pts = []; for (let i = 0; i <= 40; i++) pts.push(B(i / 40));
  line(bunting, pts, { sw: 3.5, j: 1 });
  const N = 22, cols = [CORAL, GREEN, '#F6E9DA'];
  for (let i = 0; i < N; i++) {
    const [x, y] = B((i + 0.5) / N);
    const g = el('g', { transform: `translate(${f1(x)} ${f1(y)})` }, bunting);
    const inner = el('g', {}, g);
    const col = cols[i % 3];
    poly(inner, [[-34, 0], [34, 0], [0, 76]], col, { j: 2, sw: 3.5 });
    if (col === '#F6E9DA') el('path', { d: 'M-28 4 L28 4 L0 66 Z', fill: 'url(#scallop)', opacity: 0.8 }, inner);
    FLAGS.push({ inner, ph: i * 0.7 });
  }
}

// phone
const phone = el('g', {}, world);
const phoneInner = el('g', {}, phone);
rrect(phoneInner, -160, -290, 320, 580, 42, PAPER, { sw: 5.5, hatch: false });
rrect(phoneInner, -142, -272, 284, 544, 30, null, { sw: 2, single: true, stroke: '#9a918a' });
rrect(phoneInner, -42, -262, 84, 22, 11, INK, { sw: 3, single: true, hatch: false });
text(phoneInner, -118, -196, 'QuickQuote', { anchor: 'start', size: 46 });
poly(phoneInner, [[102, -238], [86, -206], [100, -206], [90, -178], [118, -214], [103, -214], [112, -238]], CORAL, { sw: 3, j: 0.8 });
text(phoneInner, -118, -166, 'by CARMA', { anchor: 'start', cls: 'pen', size: 24, fill: '#7a706a' });
const ROWS = ['Coverage', 'Eligibility', 'Rate', 'Indication'].map((lab, i) => {
  const y0 = ROW_Y[i];
  const hi = el('g', {}, phoneInner); rrect(hi, -132, y0 - 32, 264, 64, 16, '#DDEEDD', { stroke: null, hatch: true });
  rrect(phoneInner, -120, y0 - 19, 38, 38, 7, PAPER, { sw: 3.5, hatch: false });
  text(phoneInner, -64, y0 + 12, lab, { anchor: 'start', cls: 'pen', size: 36 });
  const ck = el('path', { d: `M${-113} ${y0 + 1} L${-102} ${y0 + 13} L${-78} ${y0 - 18}`, fill: 'none', stroke: GREEN, 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': 60, 'stroke-dashoffset': 60 }, phoneInner);
  return { hi, ck };
});
const btn = el('g', {}, phoneInner);
rrect(btn, -130, BTN_Y - 34, 260, 68, 34, CORAL, { sw: 4 });
text(btn, 0, BTN_Y + 11, 'Get indication', { size: 36, fill: '#fff' });

// stopwatch
const watch = el('g', {}, world);
rrect(watch, -12, -74, 24, 18, 4, INK, { single: true, sw: 3 });
ell(watch, 0, 0, 56, 56, PAPER, { sw: 5, hatch: false });
const watchHand = el('g', {}, watch); line(watchHand, [[0, 0], [0, -38]], { sw: 5, stroke: CORAL });
ell(watch, 0, 0, 5, 5, INK, { single: true, sw: 2 });
const watchText = text(watch, 0, 108, '0:00', { size: 52 });
const watchSub = text(watch, 0, 150, 'under 3 min!', { size: 34, fill: GREEN });

// critter
const critter = el('g', {}, world);
const cBody = el('g', {}, critter);
const LEGS = [-96, -58, 58, 96].map((x) => { const g = el('g', {}, cBody); rrect(g, x - 14, -44, 28, 44, 6, CORAL, { sw: 4 }); return g; });
if (CHAR === 'folder') {
  rrect(cBody, -66, -226, 118, 58, 5, PAPER, { sw: 3.5, hatch: false });
  line(cBody, [[-52, -210], [30, -212]], { sw: 2.5, stroke: '#b9aea4' });
  rrect(cBody, -116, -216, 94, 36, 9, CORAL_DK, { sw: 4 });
  rrect(cBody, -124, -194, 248, 168, 16, CORAL, { sw: 5 });
  line(cBody, [[-110, -168], [110, -168]], { sw: 2.5, stroke: CORAL_DK, j: 1.5 });
} else {
  rrect(cBody, -124, -194, 248, 168, 22, CORAL, { sw: 5 });
  // little agent hat, tilted, with the logo's coral slash as a feather
  const hat = el('g', { transform: 'rotate(-7 -10 -196)' }, cBody);
  poly(hat, [[52, -222], [68, -222], [98, -300], [82, -300]], '#EC5F59', { sw: 3.5, j: 0.8 });
  rrect(hat, -54, -258, 108, 62, 18, GREEN, { sw: 4.5 });
  rrect(hat, -54, -222, 108, 14, 4, INK, { sw: 2, single: true, hatch: false });
  ell(hat, 0, -197, 84, 13, '#4E7A51', { sw: 4.5 });
  ell(hat, 34, -215, 7, 7, MUSTARD, { sw: 2, single: true, hatch: false });
  // green bow tie
  poly(cBody, [[-4, -46], [-34, -62], [-34, -30]], GREEN, { sw: 3.5, j: 0.8 });
  poly(cBody, [[4, -46], [34, -62], [34, -30]], GREEN, { sw: 3.5, j: 0.8 });
  rrect(cBody, -8, -54, 16, 16, 5, '#4E7A51', { sw: 3, single: true, hatch: false });
}
const face = el('g', {}, cBody);
const eyes = el('g', {}, face);
const eyeL = el('g', {}, eyes), eyeR = el('g', {}, eyes);
ell(eyeL, -44, -112, 11, 16, INK, { single: true, sw: 1, hatch: false }); el('circle', { cx: -40, cy: -118, r: 4, fill: '#fff' }, eyeL);
ell(eyeR, 44, -112, 11, 16, INK, { single: true, sw: 1, hatch: false }); el('circle', { cx: 48, cy: -118, r: 4, fill: '#fff' }, eyeR);
const eyesHappy = el('g', {}, face);
line(eyesHappy, [[-58, -106], [-44, -122], [-30, -106]], { sw: 6 }); line(eyesHappy, [[30, -106], [44, -122], [58, -106]], { sw: 6 });
ell(face, -84, -80, 16, 9, '#F3A59A', { stroke: null, hatch: false }); ell(face, 84, -80, 16, 9, '#F3A59A', { stroke: null, hatch: false });
const mSmile = line(face, [[-14, -84], [0, -76], [14, -84]], { sw: 5 });
const mOpen = poly(face, [[-18, -88], [18, -88], [12, -70], [0, -64], [-12, -70]], INK, { sw: 3, hatch: false, j: 0.8 });
const mO = ell(face, 0, -78, 9, 11, INK, { single: true, sw: 2, hatch: false });
const armL = el('g', {}, critter), armR = el('g', {}, critter);
const armLi = el('g', {}, armL), armRi = el('g', {}, armR);
rrect(armLi, -38, -14, 42, 28, 9, CORAL, { sw: 4 });
rrect(armRi, -4, -14, 42, 28, 9, CORAL, { sw: 4 });
const held = el('g', {}, critter);
function drawCard(parent) {
  rrect(parent, -104, -62, 208, 124, 10, PAPER, { sw: 4.5, hatch: false });
  text(parent, 0, -28, 'INDICATION', { cls: 'pen', size: 22, fill: '#6f665f', attrs: { 'letter-spacing': 3 } });
  text(parent, 0, 22, '$1,511', { size: 58, fill: CORAL_DK });
  text(parent, 0, 50, 'non-binding', { cls: 'pen', size: 20, fill: '#8a817a' });
}
const heldCard = el('g', { transform: `translate(0 ${HELD_Y})` }, held); drawCard(heldCard);

// papers
const PAPER_LABELS = ['ACORD 125', 'Supplemental', 'Loss runs', 'SOV', 'ACORD 126', 'Class code?', 'Questionnaire', 'Loss runs', 'ACORD 140', 'Supplemental', 'Signed apps', 'Class code?', 'Loss runs', 'ACORD 125'];
const PILE = [[885, 812], [962, 818], [1040, 810], [860, 742], [930, 736], [1000, 744], [1070, 738], [900, 668], [975, 662], [1045, 670], [940, 598], [1012, 604], [975, 540], [990, 488]];
const PAPERS = [];
{
  const r = rng(21);
  PAPER_LABELS.forEach((lab, i) => {
    const g = el('g', {}, world);
    rrect(g, -58, -72, 116, 144, 5, PAPER, { sw: 3.5, hatch: false });
    text(g, 0, -40, lab, { cls: 'pen', size: lab.length > 10 ? 17 : 20, fill: CORAL_DK });
    [-14, 6, 26, 46].forEach((y, k) => line(g, [[-40, y], [k === 3 ? 10 : 40, y + (r() - 0.5) * 3]], { sw: 2.5, stroke: '#b7ada4' }));
    const [x1, y1] = PILE[i];
    const ang = Math.atan2(y1 - 740, x1 - 960) + (r() - 0.5) * 0.8;
    PAPERS.push({ g, t0: T.papers0 + i * 0.1, x0: x1 + (r() - 0.5) * 300, r0: (r() - 0.5) * 120, x1, y1, r1: (r() - 0.5) * 34,
      vx: Math.cos(ang) * (900 + r() * 700), vy: -500 - r() * 700, spin: (r() - 0.5) * 900 });
  });
}
// peeking eyes (drawn above the pile)
const peek = el('g', {}, world);
ell(peek, -30, 0, 10, 14, INK, { single: true, sw: 1, hatch: false }); ell(peek, 30, 0, 10, 14, INK, { single: true, sw: 1, hatch: false });
el('circle', { cx: -26, cy: -5, r: 3.5, fill: '#fff' }, peek); el('circle', { cx: 34, cy: -5, r: 3.5, fill: '#fff' }, peek);
const sweat = el('g', {}, peek); sketch(sweat, 'M70 -40 q14 22 0 30 q-14 -8 0 -30 Z', null, '#A9D4F2', { sw: 3 });

// flying indication card, impact lines, sparkles
