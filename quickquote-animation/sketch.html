<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickQuote Sketch</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #1c1c1c; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #stage { width: 1920px; height: 1080px; flex: none; transform-origin: center; background: #ECEAE6; }
  svg { display: block; }
  .hand { font-family: Gaegu, 'Patrick Hand', cursive; font-weight: 700; }
  .pen { font-family: 'Patrick Hand', cursive; }
  #replay { position: fixed; right: 16px; bottom: 16px; font: 600 15px sans-serif; background: #fff; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; display: none; }
  body.live #replay { display: block; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="boil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="1" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#2a1d17" stroke-width="2.2" opacity=".09"/>
      <line x1="5" y1="0" x2="5" y2="9" stroke="#fff" stroke-width="1.4" opacity=".16"/>
    </pattern>
    <pattern id="scallop" width="22" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 12 Q5.5 3 11 12 Q16.5 3 22 12" fill="none" stroke="#E8735F" stroke-width="2.2"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#ECEAE6"/>
  <image id="paperTex" x="0" y="0" width="1920" height="1080" opacity=".55"/>
  <g id="world" filter="url(#boil)"></g>
  <g id="endLayer"></g>
</svg>
</div>
<button id="replay">↻ Replay</button>
<script>
const NS = 'http://www.w3.org/2000/svg';
const W = 1920, H = 1080, BASE_DURATION = 21, GROUND = 880;
const INK = '#2B211D', CORAL = '#E8735F', CORAL_DK = '#C9564A', GREEN = '#5E8C61', MUSTARD = '#E9B949', SKY = '#7FA9DA', PAPER = '#FFFDF8';
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const P = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inCubic = (x) => x * x * x;
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = (x, s = 1.9) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const outElastic = (x) => (x === 0 || x === 1 ? x : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3) + 1);
const bump = (t, c, d = 0.35, amp = 1) => (t >= c && t <= c + d ? Math.sin(Math.PI * (t - c) / d) * amp : 0);
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
const f1 = (v) => v.toFixed(1);

// ---------- tiny SVG + "sketchy" drawing kit ----------
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
let seedCounter = 100;
function rrPath(x, y, w, h, r, j, rnd) {
  const J = () => (rnd() - 0.5) * 2 * j;
  const p = [[x + r + J(), y + J()], [x + w - r + J(), y + J()], [x + w + J(), y + r + J()], [x + w + J(), y + h - r + J()],
    [x + w - r + J(), y + h + J()], [x + r + J(), y + h + J()], [x + J(), y + h - r + J()], [x + J(), y + r + J()]];
  const c = [[x + w, y], [x + w, y + h], [x, y + h], [x, y]];
  let d = `M${f1(p[0][0])},${f1(p[0][1])}`;
  for (let e = 0; e < 4; e++) {
    const a = p[e * 2], b = p[e * 2 + 1], n = p[(e * 2 + 2) % 8];
    d += ` Q${f1((a[0] + b[0]) / 2 + J())},${f1((a[1] + b[1]) / 2 + J())} ${f1(b[0])},${f1(b[1])}`;
    d += ` Q${c[e][0]},${c[e][1]} ${f1(n[0])},${f1(n[1])}`;
  }
  return d + 'Z';
}
function ellPath(cx, cy, rx, ry, j, rnd, n = 40) {
  let d = '';
  const ph = rnd() * 6.28, amp = j / Math.max(rx, ry);
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2, k = 1 + Math.sin(a * 3 + ph) * amp + (rnd() - 0.5) * amp * 0.4;
    d += (i ? 'L' : 'M') + f1(cx + Math.cos(a) * rx * k) + ',' + f1(cy + Math.sin(a) * ry * k);
  }
  return d + 'Z';
}
function polyPath(pts, j, rnd, close = false) {
  return 'M' + pts.map(([x, y]) => `${f1(x + (rnd() - 0.5) * j)},${f1(y + (rnd() - 0.5) * j)}`).join(' L') + (close ? 'Z' : '');
}
// fill (slightly offset, colored-pencil hatch) + main line + faint second pencil pass
function sketch(parent, d1, d2, fill, { sw = 4.5, stroke = INK, hatch = true, fillOpacity = 1 } = {}) {
  const g = el('g', {}, parent);
  if (fill) {
    el('path', { d: d1, fill, 'fill-opacity': fillOpacity, transform: 'translate(2.5 2)' }, g);
    if (hatch) el('path', { d: d1, fill: 'url(#hatch)', transform: 'translate(2.5 2)' }, g);
  }
  if (stroke) {
    el('path', { d: d1, fill: 'none', stroke, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    if (d2) el('path', { d: d2, fill: 'none', stroke, 'stroke-width': sw * 0.45, opacity: 0.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  }
  return g;
}
const rrect = (parent, x, y, w, h, r, fill, o = {}) => { const rnd = rng(o.seed ?? seedCounter++); const j = o.j ?? 2; return sketch(parent, rrPath(x, y, w, h, r, j, rnd), o.single ? null : rrPath(x, y, w, h, r, j * 1.6, rnd), fill, o); };
const ell = (parent, cx, cy, rx, ry, fill, o = {}) => { const rnd = rng(o.seed ?? seedCounter++); const j = o.j ?? 2; return sketch(parent, ellPath(cx, cy, rx, ry, j, rnd), o.single ? null : ellPath(cx, cy, rx, ry, j * 1.5, rnd), fill, o); };
const poly = (parent, pts, fill, o = {}) => { const rnd = rng(o.seed ?? seedCounter++); const j = o.j ?? 2; return sketch(parent, polyPath(pts, j, rnd, !!fill || o.close), o.single ? null : polyPath(pts, j * 1.6, rnd, !!fill || o.close), fill, o); };
const line = (parent, pts, o = {}) => poly(parent, pts, null, { single: true, ...o });
const text = (parent, x, y, str, o = {}) => { const t = el('text', { x, y, 'text-anchor': o.anchor || 'middle', class: o.cls || 'hand', 'font-size': o.size || 40, fill: o.fill || INK, ...(o.attrs || {}) }, parent); t.textContent = str; return t; };
const setT = (node, s) => node.setAttribute('transform', s);
const setO = (node, o) => { node.setAttribute('opacity', clamp(o).toFixed(3)); node.style.display = o <= 0.001 ? 'none' : ''; };

// ---------- character: ?char=folder (default) or ?char=critter (CARMA's own blocky mascot) ----------
const params = new URLSearchParams(location.search);
// folder: the QuickQuote-ad folder. The rest are the CARMA critter: tabs (index-tab ears),
// slash (logo slash as a cowlick), ink (charcoal body with coral slash blush), bolt (yellow lightning
// cowlick: quick), check (green checkmark sprout: quoted), sprout (two-leaf seedling), cowboy (lasso alt cut).
const CHAR = ['tabs', 'slash', 'ink', 'bolt', 'check', 'sprout', 'cowboy'].includes(params.get('char')) ? params.get('char') : 'folder';
const IS_INK = CHAR === 'ink', COWBOY = CHAR === 'cowboy';
const BODY = IS_INK ? '#3B3836' : CORAL, FACE_INK = IS_INK ? PAPER : INK;
const HELD_Y = { folder: -282, tabs: -318, slash: -340, ink: -290, bolt: -300, check: -300, sprout: -300, cowboy: -335 }[CHAR];   // card held overhead
const HOLD_ARM = { folder: 2.5, tabs: 3.45, slash: 4.0, ink: 2.8, bolt: 3.0, check: 3.0, sprout: 3.0, cowboy: 3.9 }[CHAR];
const STACHE = COWBOY || params.get('stache') === '1';   // handlebar mustache (always on the cowboy)
const LASSO_AT = 7.2, LASSO_LEN = COWBOY ? 2.2 : 0;   // cowboy: time inserted to rope the phone in
const DURATION = BASE_DURATION + LASSO_LEN;

// ---------- timeline ----------
const T = {
  walkIn: [0.2, 2.3], excite: 2.5, bubble1: [2.6, 3.9],
  papers0: 3.9, bubble2: [4.9, 6.0], phoneIn: [5.9, 6.5], burst: 6.6,
  walk2: [7.2, 7.9], taps: [8.2, 9.1, 10.0, 10.9], button: 11.9,
  eject: 12.25, catch: 13.05, celebrate: [13.2, 13.8, 14.4], phoneOut: [15.4, 16.0], walk3: [15.6, 17.0],
  end: 16.8,
};
const CR_X = { home: 960, phone: 1200, end: 520 };
const PHONE = { x: 1480, y: 560 };
const ROW_Y = [-130, -50, 30, 110];
const BTN_Y = 200;
const JUMP_FOR = (ly) => (GROUND - 120) - (PHONE.y + ly); // lift so the critter's arm reaches that row

// ================= build the world =================
const worldRoot = document.getElementById('world');
const buntingLayer = el('g', {}, worldRoot);
const world = el('g', {}, worldRoot);   // everything under the camera
const endLayer = document.getElementById('endLayer');

// paper texture (static, generated once)
{
  const c = document.createElement('canvas'); c.width = 960; c.height = 540;
  const x = c.getContext('2d'), img = x.createImageData(960, 540), r = rng(77);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = r(); const g = v > 0.985 ? 150 : v > 0.93 ? 205 : 245 + r() * 10;
    img.data[i] = img.data[i + 1] = g; img.data[i + 2] = g - 4; img.data[i + 3] = v > 0.93 ? 60 : 18;
  }
  x.putImageData(img, 0, 0);
  x.globalAlpha = 0.05; x.strokeStyle = '#8a7f72';
  for (let i = 0; i < 260; i++) { const px = r() * 960, py = r() * 540, a = r() * 6.28, l = 6 + r() * 20; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }
  document.getElementById('paperTex').setAttribute('href', c.toDataURL());
}

// background doodles
const bg = el('g', {}, world);
// agency building (left)
const agency = el('g', { transform: 'translate(150 0)' }, bg);
poly(agency, [[88, 618], [262, 512], [436, 618]], '#F2C9BE', { j: 2 });
rrect(agency, 112, 612, 300, 268, 6, '#F7EADF', { j: 2 });
rrect(agency, 168, 642, 188, 50, 8, PAPER, { sw: 3.5 });
text(agency, 262, 678, 'AGENCY', { cls: 'pen', size: 32 });
rrect(agency, 232, 760, 62, 120, 6, '#E7C6A8', { sw: 3.5 });
[[140, 720], [322, 720]].forEach(([x, y]) => { rrect(agency, x, y, 62, 52, 4, '#DCE8F2', { sw: 3.5 }); line(agency, [[x + 31, y + 3], [x + 31, y + 50]], { sw: 2.5 }); line(agency, [[x + 3, y + 26], [x + 59, y + 26]], { sw: 2.5 }); });
// greenhouse (right)
const greenhouse = el('g', {}, bg);
sketch(greenhouse, 'M1540 880 L1540 705 Q1542 598 1700 596 Q1858 598 1860 705 L1860 880', 'M1542 880 L1543 708 Q1546 602 1700 600 Q1855 602 1858 708 L1858 880', '#DDEBD8', {});
[1600, 1660, 1740, 1800].forEach((x) => { const top = 705 - Math.sqrt(Math.max(0, 1 - Math.pow((x - 1700) / 160, 2))) * 100; line(greenhouse, [[x, 878], [x, top + 6]], { sw: 2.5 }); });
line(greenhouse, [[1542, 760], [1858, 760]], { sw: 2.5 });
ell(greenhouse, 1700, 668, 38, 38, PAPER, { sw: 3.5 });
{ // leaf sign
  const lg = el('g', { transform: 'translate(1700 684)' }, greenhouse);
  [-60, -30, 0, 30, 60].forEach((a, i) => { const len = [22, 30, 36, 30, 22][i]; const g2 = el('g', { transform: `rotate(${a})` }, lg); ell(g2, 0, -len / 2 - 2, 5, len / 2, GREEN, { sw: 2.2, single: true, j: 0.6 }); });
  line(lg, [[0, 0], [0, 12]], { sw: 2.5 });
}
// little plants
[[1500, 880], [1880, 880], [470, 880]].forEach(([x, y], k) => { [-30, 0, 30].forEach((a) => { const g2 = el('g', { transform: `translate(${x} ${y}) rotate(${a})` }, bg); ell(g2, 0, -18, 7, 18, GREEN, { sw: 2.5, single: true, j: 0.8 }); }); });
// ground + grass
{
  const r = rng(5), pts = [];
  for (let x = -20; x <= 1940; x += 40) pts.push([x, GROUND + (r() - 0.5) * 3]);
  line(bg, pts, { sw: 4, j: 1.5 });
  line(bg, pts.map(([x, y]) => [x + 7, y + 4]), { sw: 1.6, j: 2, attrs: {} });
  for (let x = 0; x < 1920; x += 14 + r() * 22) {
    const h = 6 + r() * 12, a = (r() - 0.5) * 0.7;
    line(bg, [[x, GROUND + 2], [x + Math.sin(a) * h, GROUND - h]], { sw: 2, j: 0.4 });
    if (r() > 0.6) line(bg, [[x + 4, GROUND + 2], [x + 4 + Math.sin(-a) * h * 0.7, GROUND - h * 0.7]], { sw: 1.8, j: 0.4 });
  }
}
// bunting
const bunting = el('g', {}, buntingLayer);
const FLAGS = [];
{
  const B = (u) => [lerp(lerp(-40, 960, u), lerp(960, 1960, u), u), lerp(lerp(92, 178, u), lerp(178, 92, u), u)];
  const pts = []; for (let i = 0; i <= 40; i++) pts.push(B(i / 40));
  line(bunting, pts, { sw: 3.5, j: 1 });
  const N = 22, cols = [CORAL, GREEN, '#F6E9DA'];
  for (let i = 0; i < N; i++) {
    const [x, y] = B((i + 0.5) / N);
    const g = el('g', { transform: `translate(${f1(x)} ${f1(y)})` }, bunting);
    const inner = el('g', {}, g);
    const col = cols[i % 3];
    poly(inner, [[-34, 0], [34, 0], [0, 76]], col, { j: 2, sw: 3.5 });
    if (col === '#F6E9DA') el('path', { d: 'M-28 4 L28 4 L0 66 Z', fill: 'url(#scallop)', opacity: 0.8 }, inner);
    FLAGS.push({ inner, ph: i * 0.7 });
  }
}

// phone
const phone = el('g', {}, world);
const phoneInner = el('g', {}, phone);
rrect(phoneInner, -160, -290, 320, 580, 42, PAPER, { sw: 5.5, hatch: false });
rrect(phoneInner, -142, -272, 284, 544, 30, null, { sw: 2, single: true, stroke: '#9a918a' });
rrect(phoneInner, -42, -262, 84, 22, 11, INK, { sw: 3, single: true, hatch: false });
text(phoneInner, -118, -196, 'QuickQuote', { anchor: 'start', size: 46 });
poly(phoneInner, [[102, -238], [86, -206], [100, -206], [90, -178], [118, -214], [103, -214], [112, -238]], CORAL, { sw: 3, j: 0.8 });
text(phoneInner, -118, -166, 'by CARMA', { anchor: 'start', cls: 'pen', size: 24, fill: '#7a706a' });
const ROWS = ['Coverage', 'Eligibility', 'Rate', 'Indication'].map((lab, i) => {
  const y0 = ROW_Y[i];
  const hi = el('g', {}, phoneInner); rrect(hi, -132, y0 - 32, 264, 64, 16, '#DDEEDD', { stroke: null, hatch: true });
  rrect(phoneInner, -120, y0 - 19, 38, 38, 7, PAPER, { sw: 3.5, hatch: false });
  text(phoneInner, -64, y0 + 12, lab, { anchor: 'start', cls: 'pen', size: 36 });
  const ck = el('path', { d: `M${-113} ${y0 + 1} L${-102} ${y0 + 13} L${-78} ${y0 - 18}`, fill: 'none', stroke: GREEN, 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': 60, 'stroke-dashoffset': 60 }, phoneInner);
  return { hi, ck };
});
const btn = el('g', {}, phoneInner);
rrect(btn, -130, BTN_Y - 34, 260, 68, 34, CORAL, { sw: 4 });
text(btn, 0, BTN_Y + 11, 'Get indication', { size: 36, fill: '#fff' });

// stopwatch
const watch = el('g', {}, world);
rrect(watch, -12, -74, 24, 18, 4, INK, { single: true, sw: 3 });
ell(watch, 0, 0, 56, 56, PAPER, { sw: 5, hatch: false });
const watchHand = el('g', {}, watch); line(watchHand, [[0, 0], [0, -38]], { sw: 5, stroke: CORAL });
ell(watch, 0, 0, 5, 5, INK, { single: true, sw: 2 });
const watchText = text(watch, 0, 108, '0:00', { size: 52 });
const watchSub = text(watch, 0, 150, 'under 3 min!', { size: 34, fill: GREEN });

// critter
const critter = el('g', {}, world);
const cBody = el('g', {}, critter);
const CUTE = CHAR !== 'folder';
const EYE_Y = CUTE ? -104 : -112, EYE_DX = CUTE ? 50 : 44, MOUTH_Y = CUTE ? (STACHE ? -50 : -74) : -80, LEG_H = CUTE ? 34 : 44;
const LEGS = [-96, -58, 58, 96].map((x) => { const g = el('g', {}, cBody); rrect(g, x - 14, -LEG_H, 28, LEG_H, CUTE ? 12 : 6, CORAL, { sw: 4 }); return g; });
let EARS = null, TUFT = null;
if (CHAR === 'folder') {
  rrect(cBody, -66, -226, 118, 58, 5, PAPER, { sw: 3.5, hatch: false });
  line(cBody, [[-52, -210], [30, -212]], { sw: 2.5, stroke: '#b9aea4' });
  rrect(cBody, -116, -216, 94, 36, 9, CORAL_DK, { sw: 4 });
  rrect(cBody, -124, -194, 248, 168, 16, CORAL, { sw: 5 });
  line(cBody, [[-110, -168], [110, -168]], { sw: 2.5, stroke: CORAL_DK, j: 1.5 });
} else {
  if (CHAR === 'tabs') {   // two index tabs from the QuickQuote folder, worn as ears
    const earL = el('g', {}, cBody), earR = el('g', {}, cBody);
    rrect(earL, -100, -236, 66, 64, 14, PAPER, { sw: 4, hatch: false }); line(earL, [[-88, -220], [-50, -221]], { sw: 2.5, stroke: '#b9aea4' });
    rrect(earR, 30, -244, 72, 72, 14, '#F6E9DA', { sw: 4 }); line(earR, [[42, -226], [88, -227]], { sw: 2.5, stroke: '#b9aea4' }); line(earR, [[42, -212], [72, -212]], { sw: 2.5, stroke: '#b9aea4' });
    EARS = [[earL, -67, -180], [earR, 66, -180]];
  }
  if (CHAR === 'slash') {  // the coral slash from the CARMA logo as a cowlick
    TUFT = el('g', {}, cBody);
    poly(TUFT, [[-4, -180], [22, -180], [62, -272], [36, -272]], '#EC5F59', { sw: 4.5, j: 0.8 });
  }
  if (CHAR === 'bolt') {   // yellow lightning cowlick: the "Quick" in QuickQuote
    TUFT = el('g', {}, cBody);
    poly(TUFT, [[10, -296], [36, -296], [16, -256], [34, -256], [-10, -194], [2, -238], [-16, -238]], MUSTARD, { sw: 4.5, j: 0.6 });
  }
  if (CHAR === 'check') {  // green checkmark sprouting from the head: quoted / approved
    TUFT = el('g', {}, cBody);
    const ck = [[-30, -240], [-8, -216], [30, -276]];
    line(TUFT, [[-8, -196], [-8, -216]], { sw: 22, j: 0.5 }); line(TUFT, ck, { sw: 26, j: 0.5 });
    line(TUFT, [[-8, -196], [-8, -216]], { sw: 12, stroke: GREEN, j: 0.5 }); line(TUFT, ck, { sw: 16, stroke: GREEN, j: 0.5 });
  }
  if (CHAR === 'sprout') { // two-leaf seedling
    TUFT = el('g', {}, cBody);
    line(TUFT, [[4, -196], [0, -222], [4, -242]], { sw: 5 });
    const lf = el('g', { transform: 'rotate(-38 0 -238)' }, TUFT); ell(lf, -26, -238, 26, 13, GREEN, { sw: 4 });
    const rf = el('g', { transform: 'rotate(30 6 -244)' }, TUFT); ell(rf, 34, -244, 28, 14, '#7DAA7C', { sw: 4 });
  }
  rrect(cBody, -126, -200, 252, 174, 44, BODY, { sw: 5 });
  ell(cBody, -62, -170, 28, 10, '#fff', { stroke: null, hatch: false, fillOpacity: 0.25 });
  if (COWBOY) {  // green bandana
    poly(cBody, [[-40, -38], [40, -38], [0, -8]], GREEN, { sw: 3.5, j: 0.8 });
    ell(cBody, 0, -38, 9, 6, '#4E7A51', { sw: 3, single: true, hatch: false });
  }
}
const face = el('g', {}, cBody);
const eyes = el('g', {}, face);
const eyeL = el('g', {}, eyes), eyeR = el('g', {}, eyes);
const ERX = CUTE ? 15 : 11, ERY = CUTE ? 20 : 16;
[[eyeL, -EYE_DX], [eyeR, EYE_DX]].forEach(([g, ex]) => {
  if (IS_INK) ell(g, ex, EYE_Y, ERX + 7, ERY + 7, PAPER, { single: true, sw: 2.5, hatch: false });
  ell(g, ex, EYE_Y, ERX, ERY, INK, { single: true, sw: 1, hatch: false });
  el('circle', { cx: ex + (CUTE ? 5 : 4), cy: EYE_Y - (CUTE ? 8 : 6), r: CUTE ? 5.5 : 4, fill: '#fff' }, g);
  if (CUTE) el('circle', { cx: ex - 5, cy: EYE_Y + 9, r: 2.6, fill: '#fff' }, g);
});
const eyesHappy = el('g', {}, face);

  const secs = clamp((t - 8.0) / (12.6 - 8.0)) * 167;
  setT(watch, `translate(820 ${f1(400 + Math.sin(t * 2) * 6)}) scale(${(wk * (1 + bump(t, 12.6, 0.3, 0.15))).toFixed(3)}) rotate(${f1(Math.sin(t * 1.7) * 3)})`);
  setT(watchHand, `rotate(${f1(secs * 6)})`);
  watchText.textContent = `${Math.floor(secs / 60)}:${String(Math.floor(secs % 60)).padStart(2, '0')}`;
  watchText.setAttribute('fill', t >= 12.6 ? GREEN : INK);
  setO(watchSub, P(t, 12.6, 12.9));

  // ---- flying card
  if (t >= T.eject && t < T.catch) {
    let cx, cy, cr, cs;
    if (t < T.eject + 0.35) { const k = outCubic(P(t, T.eject, T.eject + 0.35)); cx = PHONE.x; cy = lerp(PHONE.y - 250, PHONE.y - 330, k); cr = 0; cs = lerp(0.4, 1, k); }
    else { const k = inOut(P(t, T.eject + 0.35, T.catch)); cx = lerp(PHONE.x, CR_X.phone, k); cy = lerp(PHONE.y - 330, GROUND + HELD_Y, k) - Math.sin(Math.PI * k) * 120; cr = k * 360; cs = 1; }
    setO(flyCard, 1); setT(flyCard, `translate(${f1(cx)} ${f1(cy)}) rotate(${f1(cr)}) scale(${cs.toFixed(3)})`);
  } else setO(flyCard, 0);
  const im = t > T.catch && t < T.catch + 0.9 ? 1 - P(t, T.catch + 0.5, T.catch + 0.9) : 0;
  setO(impact, im);
  setT(impact, `translate(${f1(x)} ${f1(y - bob + HELD_Y)}) scale(${(0.8 + 0.25 * Math.abs(Math.sin(t * 14))).toFixed(3)})`);

  // ---- bubbles
  const pop = (a, b) => (t < a || t > b ? 0 : Math.min(outBack(P(t, a, a + 0.35), 2.2), 1 - inCubic(P(t, b - 0.22, b))));
  const b1 = pop(...T.bubble1); setO(bub1, b1 > 0 ? 1 : 0); setT(bub1, `translate(1020 470) scale(${Math.max(0.001, b1).toFixed(3)})`);
  const b2 = pop(...T.bubble2); setO(bub2, b2 > 0 ? 1 : 0); setT(bub2, `translate(700 440) scale(${Math.max(0.001, b2).toFixed(3)}) rotate(${f1(Math.sin(t * 8) * 1.5)})`);
  const b3 = pop(13.15, 15.3); setO(bub3, b3 > 0 ? 1 : 0); setT(bub3, `translate(930 360) scale(${Math.max(0.001, b3).toFixed(3)}) rotate(${f1(-4 + Math.sin(t * 6) * 2)})`);

  // ---- confetti
  CONF.forEach((c) => {
    const d = t - 13.1;
    if (d < 0) { setO(c.g, 0); return; }
    let cx, cy;
    if (c.burst) { cx = CR_X.phone + c.vx * d * Math.exp(-d * 1.2); cy = GROUND + HELD_Y + c.vy * d * Math.exp(-d * 1.2) + 300 * d * d; }
    else { cx = c.x0 + Math.sin(d * 2 + c.ph) * c.sway; cy = c.y0 + c.v * d * 1.6; }
    setO(c.g, cy < GROUND + 10 ? (c.burst ? 1 - P(d, 2.2, 3) : 1) : 0);
    setT(c.g, `translate(${f1(cx)} ${f1(cy)}) rotate(${f1(c.spin * d)}) scale(${(0.7 + 0.3 * Math.cos(d * 5 + c.ph)).toFixed(3)} 1)`);
  });

  // ---- end card
  const e = (a, s = 2) => outBack(P(t, a, a + 0.45), s);
  const at = (node, a, dy = 0, s = 2) => { const k = e(a, s); setO(node, clamp(k * 2)); setT(node, `translate(0 ${f1((1 - k) * 30 + dy)})`); };
  at(endLogo, T.end); at(endQQ, T.end + 0.3);
  underline.setAttribute('stroke-dashoffset', f1(560 * (1 - outCubic(P(t, T.end + 0.6, T.end + 1.0)))));
  at(endL1, T.end + 0.7, 0, 1.4); at(endL2, T.end + 0.9, 0, 1.4);
  const ck = e(T.end + 1.3, 2.2); setO(endCta, clamp(ck * 2));
  const pulse = t > T.end + 2 ? 1 + Math.sin((t - T.end - 2) * 5) * 0.015 : 1;
  setT(endCta, `translate(${EX} 782) scale(${(Math.max(0.001, ck) * pulse).toFixed(3)}) translate(${-EX} -782)`);
  setO(endFine, P(t, T.end + 1.6, T.end + 2.0));
}
function drawLasso(t) {
  const u = t - LASSO_AT;
  const on = COWBOY && u >= 0 && u <= LASSO_LEN;
  setO(lassoG, on ? 1 : 0); setO(speedLines, 0); dust.forEach((d) => setO(d, 0));
  const yb = COWBOY && u > 0.05 && u < 1.0 ? Math.min(outBack(P(u, 0.05, 0.35), 2.2), 1 - inCubic(P(u, 0.8, 1.0))) : 0;
  setO(yeehaw, yb > 0 ? 1 : 0); setT(yeehaw, `translate(700 440) scale(${Math.max(0.001, yb).toFixed(3)})`);
  if (!on) return;
  // widen the shot a little to show the throw, then land back where the base timeline resumes
  const zk = Math.sin(Math.PI * clamp(u / LASSO_LEN));
  setT(world, `translate(960 540) scale(${lerp(1.35, 1.1, zk).toFixed(4)}) translate(${f1(-lerp(960, 1200, zk))} -560)`);
  const cx = CR_X.home, cy = GROUND;
  const kThrow = P(u, 0.9, 1.12), kYank = P(u, 1.15, 1.7), kSettle = P(u, 1.7, 1.85);
  // the lasso cinches the phone skinny while it's hauled in, then it springs back on release
  const squeeze = u < 1.7 ? lerp(1, 0.66, outCubic(P(u, 1.15, 1.3))) + Math.sin(u * 40) * 0.012 * P(u, 1.3, 1.4) : lerp(0.66, 1, outElastic(P(u, 1.7, 2.2)));
  let aR = -100 + Math.sin(u * 22) * 10, sR = 2.4, lean = 0;
  if (u >= 0.9) { aR = lerp(-100, -8, outCubic(kThrow)); sR = lerp(2.4, 2.9, kThrow); }
  if (u >= 1.15) { aR = lerp(-8, 6, kYank); sR = lerp(2.9, 1.5, inOut(kYank)); lean = -9 * Math.sin(Math.PI * Math.min(1, kYank * 1.1)); }
  if (u >= 1.7) { aR = lerp(6, 0, kSettle); sR = lerp(1.5, 1, kSettle); }
  const hop = u < 0.9 ? Math.abs(Math.sin(u * 11)) * 10 : 0;
  setT(critter, `translate(${cx} ${f1(cy - hop)}) rotate(${f1(lean)})`);
  setT(armRi, `rotate(${f1(aR)}) scale(${sR.toFixed(3)} 1)`);
  LEGS.forEach((g) => setT(g, ''));
  setO(eyes, u < 1.15 ? 0 : 1); setO(eyesHappy, u < 1.15 ? 1 : 0); setO(mOpen, 1); setO(mSmile, 0); setO(mO, 0);
  // hand position in world space
  const L = 38 * sR, ar = (aR * Math.PI) / 180, lr = (lean * Math.PI) / 180;
  const lx = 122 + Math.cos(ar) * L, ly = -120 + Math.sin(ar) * L;
  const hx = cx + lx * Math.cos(lr) - ly * Math.sin(lr), hy = cy - hop + lx * Math.sin(lr) + ly * Math.cos(lr);
  // the phone gets roped in from off-screen right
  const phx = u >= 1.15 ? lerp(2350, PHONE.x, outBack(kYank, 1.2)) : 2350;
  setO(phone, u >= 1.15 ? 1 : 0);
  setT(phone, `translate(${f1(phx)} ${PHONE.y}) rotate(${f1((1 - kYank) * -10 + bump(u, 1.62, 0.18, 4))}) scale(${squeeze.toFixed(3)} ${(1 + (1 - squeeze) * 0.45).toFixed(3)})`);
  let loopPath, ropePath;
  if (u < 0.9) {   // twirl overhead
    const lcx = hx - 10, lcy = hy - 46, th = u * 19;
    loopPath = loopD(lcx, lcy, 118, 30);
    ropePath = `M${f1(hx)},${f1(hy)} Q${f1(hx + 10)},${f1(hy - 30)} ${f1(lcx + Math.cos(th) * 118)},${f1(lcy + Math.sin(th) * 30)}`;
  } else if (u < 1.15) {   // throw
    const k = inOut(kThrow), rx = lerp(118, 90, k);
    const lcx = lerp(hx - 10, 2250, k), lcy = lerp(hy - 46, 560, k) - Math.sin(Math.PI * k) * 160;
    loopPath = loopD(lcx, lcy, rx, lerp(30, 70, k));
    ropePath = `M${f1(hx)},${f1(hy)} Q${f1((hx + lcx) / 2)},${f1(Math.max(hy, lcy) + 60)} ${f1(lcx - rx)},${f1(lcy)}`;
  } else {   // taut, yank, then slack
    const rx = (u < 1.7 ? lerp(190, 176 * squeeze + 8, P(u, 1.15, 1.3)) : 176 * squeeze + 8 + 50 * kSettle);
    const lx2 = phx - rx, ly2 = PHONE.y + 20, sag = u >= 1.7 ? lerp(4, 90, kSettle) : 4;
    loopPath = loopD(phx, ly2, rx, 44 + (u >= 1.7 ? 10 * kSettle : 0));
    ropePath = `M${f1(hx)},${f1(hy)} Q${f1((hx + lx2) / 2)},${f1((hy + ly2) / 2 + sag)} ${f1(lx2)},${f1(ly2)}`;
  }
  [ropeOutline, rope].forEach((pth) => pth.setAttribute('d', ropePath));
  [loopOutline, loop].forEach((pth) => pth.setAttribute('d', loopPath));
  setO(lassoG, u >= 1.7 ? 1 - kSettle : 1);
  if (u >= 1.15 && u < 1.75) {
    setO(speedLines, Math.sin(Math.PI * P(u, 1.15, 1.75))); setT(speedLines, `translate(${f1(phx + 190)} ${PHONE.y})`);
    dust.forEach((d, i) => { const q = P(u, 1.2 + i * 0.1, 1.6 + i * 0.1); setO(d, Math.sin(Math.PI * q)); setT(d, `translate(${f1(cx - 90 - i * 60 - q * 60)} ${f1(GROUND - 16 - q * 30)}) scale(${(0.5 + q).toFixed(3)})`); });
  }
  SPARK.forEach((sp, i) => { const k = bump(u, 1.85 + i * 0.05, 0.3, 1); if (k > 0) { setO(sp.g, k); setT(sp.g, `translate(${f1(PHONE.x + sp.x)} ${f1(PHONE.y + sp.y)}) scale(${(0.4 + k).toFixed(3)})`); } });
}
// cowboy cut: hold the base timeline at LASSO_AT while the critter ropes the phone in
function setTime(t) {

  drawBase(b, t);
  drawLasso(t);
}
window.setTime = setTime;
window.DURATION = DURATION;
window.STAGE = [W, H];
const BASE_SFX = [
  ...Array.from({ length: 14 }, (_, i) => ({ t: 0.3 + i * 0.145, k: 'step' })),
  { t: T.excite, k: 'boing' }, { t: T.bubble1[0], k: 'pop' },
  ...PAPERS.map((p) => ({ t: p.t0 + 0.42, k: 'paper' })),
  { t: T.bubble2[0], k: 'pop2' }, { t: T.phoneIn[0], k: 'whoosh' }, { t: 6.35, k: 'ding' }, { t: 6.4, k: 'sparkle' },
  { t: T.burst, k: 'boing' }, { t: T.burst + 0.02, k: 'whoosh' },
  ...Array.from({ length: 5 }, (_, i) => ({ t: 7.25 + i * 0.13, k: 'step' })),
  { t: 7.95, k: 'pop2' },
  ...T.taps.map((c) => ({ t: c - 0.3, k: 'hop' })),
  ...[...T.taps, T.button].map((c) => ({ t: c, k: 'click' })),
  ...T.taps.map((c) => ({ t: c + 0.05, k: 'scribble' })),
  ...T.taps.map((c) => ({ t: c + 0.12, k: 'ding' })),
  { t: 12.6, k: 'ding' }, { t: T.eject, k: 'whoosh' },
  { t: T.catch, k: 'chime' }, { t: T.catch + 0.05, k: 'confetti' }, { t: 13.15, k: 'pop' },
  ...T.celebrate.map((c) => ({ t: c, k: 'boing' })),
  { t: T.phoneOut[0], k: 'whoosh' },
  ...Array.from({ length: 10 }, (_, i) => ({ t: 15.7 + i * 0.13, k: 'step' })),
  { t: T.end, k: 'pop' }, { t: T.end + 0.3, k: 'pop2' }, { t: T.end + 0.6, k: 'scribble' },
  { t: T.end + 0.7, k: 'pop2' }, { t: T.end + 0.9, k: 'pop2' }, { t: T.end + 1.3, k: 'pop' }, { t: T.end + 1.4, k: 'sparkle' },
];
const LASSO_SFX = [[0.05, 'pop'], [0.1, 'swish'], [0.4, 'swish'], [0.7, 'swish'], [0.9, 'whoosh'], [1.15, 'boing'], [1.17, 'whoosh'],
  [1.22, 'pop2'], [1.25, 'paper'], [1.4, 'paper'], [1.55, 'paper'], [1.72, 'boing'], [1.9, 'ding'], [1.95, 'sparkle']].map(([u, k]) => ({ t: LASSO_AT + u, k }));
window.SFX = COWBOY
  ? [...BASE_SFX.filter((c) => !(c.t >= 5.85 && c.t <= 6.45)).map((c) => ({ ...c, t: c.t >= LASSO_AT ? c.t + LASSO_LEN : c.t })), ...LASSO_SFX]
  : BASE_SFX;

// ---------- live playback ----------
function fit() { document.getElementById('stage').style.transform = `scale(${Math.min(innerWidth / W, innerHeight / H)})`; }
if (!params.has('render')) {
  document.body.classList.add('live');
  fit(); addEventListener('resize', fit);
  let start = null;
  document.fonts.ready.then(() => {
    const loop = (now) => { if (start === null) start = now; setTime(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);

} else setTime(0);
